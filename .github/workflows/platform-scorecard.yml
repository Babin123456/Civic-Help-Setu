name: Civic platform evidence scorecard

on:
  workflow_run:
    workflows: [Pull request quality, Lighthouse CI & Accessibility Budgets]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main-branch commit to evaluate (blank uses current main)
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-scorecard-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scorecard:
    if: >-
      github.repository == 'GoldRay19/Civic-Help-Setu' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted collector from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Collect verified evidence and bounded history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVALUATED_SHA: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/platform-scorecard/collect.mjs --sha "$EVALUATED_SHA"

      - name: Publish scorecard and trend artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: civic-platform-scorecard
          path: .platform-scorecard/
          if-no-files-found: error
          retention-days: 90
