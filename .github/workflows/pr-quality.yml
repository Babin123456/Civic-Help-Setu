name: Pull request quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node22-

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Civic contract compatibility and change audit
        id: contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run contracts:check -- --base "$CONTRACT_BASE_SHA"

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Record platform quality evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          QUALITY_INSTALL: ${{ steps.install.outcome }}
          QUALITY_CONTRACTS: ${{ steps.contracts.outcome }}
          QUALITY_LINT: ${{ steps.lint.outcome }}
          QUALITY_TEST: ${{ steps.test.outcome }}
          QUALITY_BUILD: ${{ steps.build.outcome }}
        run: node scripts/platform-quality-evidence.mjs

      - name: Upload platform quality evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: civic-quality-evidence
          path: .platform-evidence/quality.json
          if-no-files-found: error
          retention-days: 14
