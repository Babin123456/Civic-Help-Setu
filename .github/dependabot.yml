version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-patches:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      action-patches:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
